[package]
name = "gnirehtet"
version = "2.5.1"
authors = ["Romain Vimont <rom@rom1v.com>"]
edition = "2024"

[lib]
name = "relaylib"
path = "src/lib.rs"

[dependencies]
log = "0.4"       # for logs
chrono = "0.4"    # for formatting timestamp in logs
byteorder = "1.3" # for reading/writing binary
rand = "0.10"      # for random TCP sequence number
ctrlc = { version = "3.0", features = ["termination"] }     # for handling Ctrl+C
tokio = { version = "1.53.2", features = ["rt", "net", "time", "sync", "macros", "io-util"] } # for async I/O

[profile.release]
lto = true     # link-time optimization
