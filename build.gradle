// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    compileSdkVersion = 28
    buildToolsVersion = "28.0.3"
}

buildscript {
    repositories {
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        jcenter()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task debugAll(dependsOn: [':app:assembleDebug', ':relay:debug'])
task releaseAll(dependsOn: [':app:assembleRelease', ':relay:release'])

task releaseWindows(dependsOn: [':app:assembleRelease', ':relay:releaseCrossToWindows'])

task checkAll(dependsOn: [':app:check', ':relay:check'])
